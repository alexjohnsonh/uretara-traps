<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#1c2420;--mute:#5d6a62;--line:#dfe5e0;--brand:#1f5c3a;--brand2:#2f7d52;--ok:#2f8f4e;--warn:#c47a12;--bad:#b83a2e;--chip:#e8efe9}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;font-weight:650}
header small{opacity:.8;font-size:12px;display:block;font-weight:400}
header .round{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 2px 9px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 8px}
h3{font-size:15px;margin:14px 0 6px}
.mute{color:var(--mute)}.sm{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 14px;font-size:15px;font-weight:550;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.full{width:100%}
.btn.sm{padding:7px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer}
.num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--chip);flex:none}
.num.done{background:var(--ok);color:#fff}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--mute)}
.pill.ok{background:#dcefe2;color:#1e6b39}.pill.warn{background:#f7e7cc;color:#8a5408}.pill.bad{background:#f5d9d5;color:#8e2a20}
@media (prefers-color-scheme:dark){.pill.ok{background:#1f3b29;color:#8fd6a6}.pill.warn{background:#3d2f17;color:#f0c27a}.pill.bad{background:#3e211d;color:#f0a59b}}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:80px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 12px;font-size:14px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:24px;color:var(--ink)}
.stepper input{text-align:center;font-size:22px;font-weight:700}
.prog{display:flex;gap:4px;margin:4px 0 12px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--brand)}
.tag{display:inline-block;font-size:11.5px;font-weight:650;line-height:1.3;padding:1px 7px;border-radius:6px;margin:0 6px 2px 0;vertical-align:1px;white-space:nowrap}

.tip{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.warnbox{background:#fbeee9;border:1px solid #efc7bd;color:#7b2a1e;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
@media (prefers-color-scheme:dark){.warnbox{background:#3a201b;border-color:#5d332b;color:#f4c0b6}}
ol.steps{padding-left:22px;margin:6px 0}ol.steps li{margin:6px 0}
.compass{width:220px;height:220px;margin:6px auto;display:block}
.big{font-size:30px;font-weight:750}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--mute)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:left;white-space:nowrap}
th{background:var(--chip)}
td.c,th.c{text-align:center}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.diagram{width:100%;max-width:340px;display:block;margin:6px auto}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
#mapsvg{width:100%;height:auto;background:var(--bg);border-radius:10px;touch-action:manipulation}
@media print{
  header,nav,.noprint{display:none!important}
  body,html{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card{border:0;padding:0}
  th{background:#e8efe9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #view>*:not(#reportOut){display:none!important}
}
</style>

/* ---------- Storage (IndexedDB, falls back to memory) ---------- */
const DB={db:null,mem:{}};
DB.open=()=>new Promise(res=>{try{const r=indexedDB.open('at220',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('photos');};r.onsuccess=()=>{DB.db=r.result;res();};r.onerror=()=>res();}catch(e){res();}});
DB.get=(store,k)=>new Promise(res=>{if(!DB.db)return res(DB.mem[store+k]);try{const q=DB.db.transaction(store).objectStore(store).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res();}catch(e){res();}});
DB.put=(store,k,v)=>new Promise(res=>{if(!DB.db){DB.mem[store+k]=v;return res();}try{const t=DB.db.transaction(store,'readwrite');t.objectStore(store).put(v,k);t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res();}});
DB.all=(store)=>new Promise(res=>{if(!DB.db)return res({});const out={};try{const c=DB.db.transaction(store).objectStore(store).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue();}else res(out);};}catch(e){res(out);}});

/* ---------- GPS & compass ---------- */
const G={pos:null,heading:null,watch:null};
function gpsWait(x){const m={insecure:'GPS and compass are blocked because the app was opened as a file or preview. Open it from its web address (https://…) or the home-screen icon.',denied:'Location permission is blocked for this app. Allow Location for this site in the browser, and for the browser in phone Settings › Apps.',off:'No GPS signal yet – check Location is turned on (swipe down from the top of the screen) and you are outdoors.',nogeo:'This browser has no GPS access.'};return G.err?m[G.err]:(x||'Waiting for GPS…');}

/* ---------- Trap diagram (schematic) ---------- */
function trapSVG(hl){
  if(hl==='none'||hl==='')return '';
  if(hl==='led')return `<figure style="margin:8px 0 12px"><img src="images/button-led-photo.jpg" alt="Trap circuit board showing the LED (light) and the button" style="display:block;width:100%;max-width:520px;border-radius:10px;border:1px solid var(--line)"><figcaption style="font-size:12px;color:var(--mute);margin-top:4px">The LED (light) and button on the trap's circuit board.</figcaption></figure>`;
  const H=k=>hl===k?'#e0482f':'currentColor', F=k=>hl===k?'rgba(224,72,47,.18)':'none';
  return `<svg class="diagram" viewBox="0 0 360 300" fill="none" stroke="currentColor" stroke-width="2" font-family="system-ui" font-size="12">
  <rect x="20" y="0" width="34" height="300" fill="rgba(120,90,60,.15)" stroke="none"/><text x="24" y="292" fill="currentColor" stroke="none" font-size="10">tree</text>
  <rect x="58" y="40" width="22" height="16"/><rect x="58" y="210" width="22" height="16"/>
  <rect x="80" y="20" width="110" height="230" rx="14"/>
  <rect x="96" y="34" width="78" height="44" rx="6" stroke="${H('battery')}" fill="${F('battery')}"/>
  <text x="135" y="61" text-anchor="middle" fill="${H('battery')}" stroke="none">battery</text>
  <path d="M135 90 q-18 0 -18 22 v20 h36 v-20 q0 -22 -18 -22z" stroke="${H('lure')}" fill="${F('lure')}"/>
  <text x="135" y="120" text-anchor="middle" fill="${H('lure')}" stroke="none">lure</text>
  <path d="M135 132 v40" stroke="${H('lure')}" stroke-dasharray="3 3"/>
  <circle cx="135" cy="152" r="9" stroke="${H('led')}" fill="${hl==='led'?'#3fb36b':'none'}"/>
  <rect x="96" y="176" width="78" height="48" rx="6" stroke="${H('eyes')}" fill="${F('eyes')}"/>
  <circle cx="114" cy="200" r="6" stroke="${H('eyes')}"/><circle cx="156" cy="200" r="6" stroke="${H('eyes')}"/>
  <path d="M135 250 v42 M120 292 h30" stroke="${H('ladder')}"/>
  <path d="M190 236 C215 250 205 280 230 292" stroke="${H('ladder')}" stroke-dasharray="4 3"/>
  <g stroke="var(--mute)" stroke-width="1"><path d="M174 56 H232"/><path d="M153 112 H232"/><path d="M144 152 H232"/><path d="M174 200 H232"/><path d="M215 280 H232"/></g>
  <g fill="currentColor" stroke="none">
  <text x="236" y="60" fill="${H('battery')}">Battery pack</text>
  <text x="236" y="116" fill="${H('lure')}">Lure pouch + hose</text>
  <text x="236" y="156" fill="${H('led')}">LED button</text>
  <text x="236" y="204" fill="${H('eyes')}">Sensor eyes</text>
  <text x="236" y="284" fill="${H('ladder')}">Rat ladder / mesh</text>
  </g>
  <text x="170" y="14" text-anchor="middle" fill="var(--mute)" stroke="none" font-size="10">Schematic only – not to scale. Add your own photos below.</text>
  </svg>`;
}

/* ---------- Guides ---------- */
let GUIDES=[{"id": "safety", "t": "Safety first", "hl": "led", "steps": [{"text": "[Trap] Treat every AT220 as LIVE. Keep hands, fingers and face away from the trap opening and kill bar at all times.", "photo": "safety-handling.jpg"}, {"text": "[Trap] The button: **1 press** wakes the trap. **One more press** (after waking) fires it. **3 presses** = pump mode (constant orange) – then **press and hold** to pump lure. **4 presses without pausing** sets the trap (green). Wait 1–3 seconds between each of these. See **Button presses & lights**.", "photo": ""}, {"text": "[Trap] Before cleaning the lights or clearing debris: **trigger the trap first** – press once to wake, wait 1–3 seconds, press once more (constant red) – **then remove the battery**, with the kill bar closed so it can't re-set.", "photo": ""}, {"text": "[Trap] Only reconnect the battery and set the trap when everything else is finished and your hands are clear.", "photo": ""}, {"text": "Wear gloves when handling dead animals or lure. Bag carcasses and remove them from the site if required.", "photo": ""}], "tip": [], "warn": ["**NEVER put hands inside a set trap.**"]}, {"id": "guideapp", "t": "Finding your way around the Guidance app", "hl": "none", "steps": [{"text": "[Guidance app] The menu bar along the **bottom of the screen** has five buttons, left to right: **Traps** (trap list), **Map** (offline map with your GPS position), **Service** (step-by-step service form), **Guides** (these instructions) and **Report** (round results).", "photo": ""}, {"text": "[Guidance app] The **round name** button at the **top right** of the green header (e.g. \"Nov 2026\") opens Settings – change the round, import the trap list, load app-text.xlsx, backup.", "photo": ""}, {"text": "[Guidance app] To find a trap: tap **Traps** (bottom left), then tap the trap. Its page shows distance and direction – tap **Use compass** for a pointing arrow. Location notes are further down the page.", "photo": ""}, {"text": "[Guidance app] To service a trap: tap **Service** (middle of the bottom bar), or **Start service of trap …** (the green button at the bottom of a trap's page). On the first screen pick the trap under **Nearest to you** or **Or choose**.", "photo": ""}, {"text": "[Guidance app] The service form has 8 screens – the coloured bar at the top shows where you are. Tap **Next ›** (bottom right) to move on, **‹ Back** (bottom left) to go back. The small grey buttons on each screen (e.g. **How to replace**) open the matching guide.", "photo": ""}, {"text": "[Guidance app] On the last screen tap **Save service** (bottom right). The trap then shows as done in the Traps list.", "photo": ""}, {"text": "[Guidance app] For the report tap **Report** (bottom right of the menu bar). The **Print / Save PDF**, **Excel** and **CSV** buttons are at the top of the report.", "photo": ""}], "tip": ["Labels on each step show where it happens: **At the trap** (on the trap itself), **NZAT app** (the NZ Autotraps app), **Phone settings** (your phone's own Wi-Fi / flight mode settings) or **Guidance app** (this app)."], "warn": []}, {"id": "data", "t": "Reading the trap data", "hl": "led", "steps": [{"text": "[NZAT app] Install the free NZAT app (NZ Autotraps / GroundTruth) on your phone and log in **before** leaving mobile coverage.", "photo": ""}, {"text": "[NZAT app] At the trap, connect to the trap's Wi-Fi from the NZAT app – no mobile coverage is needed. See the **Using the NZAT app** and **NZAT app – where to find things** guides (Guides button, bottom of screen).", "photo": ""}, {"text": "[NZAT app] On the NZAT **Triggers** tab (bottom of screen) read the **Triggers** and **Possums** boxes at the top – not All cycles. **Triggers minus possums = rats**.", "photo": ""}, {"text": "[NZAT app] Note the trap number, number of possums, total triggers and the **run time** shown (days only).", "photo": ""}, {"text": "[Guidance app] Enter these on screen 3 of the service form (**Service**, bottom of screen) – it works out the rats for you.", "photo": ""}, {"text": "[NZAT app] **Re-set the counts** – green **RESET COUNTS** button on the Triggers tab, under the count boxes – so the next round starts from zero.", "photo": ""}, {"text": "[Guidance app] If the NZAT app will not connect, count carcasses / signs on the ground and tap **Manual count** (under \"How were counts obtained?\" on screen 3 of the service form).", "photo": ""}], "tip": ["Data entered in the NZAT app can also sync to Trap.NZ later (AT220 Telemetry report). The Guidance app keeps its own offline copy for the Uretara report."], "warn": []}, {"id": "nzat", "t": "Using the NZAT app – servicing step by step", "hl": "none", "steps": [{"text": "[Phone settings] Have your phone on. **Turn phone Wi-Fi OFF.** iPhone: swipe down from the **top-right corner** of the screen and tap the Wi-Fi icon. Android: swipe down from the **top of the screen** and tap Wi-Fi.", "photo": "nzat-01.jpg"}, {"text": "[NZAT app] Open the NZAT app. It opens on the **Comms** screen. The NZAT app's tabs run along the **bottom of the screen**: **Comms**, **Trap**, **Triggers**, **Pump**. (If the app finds no connection, you may need to turn on flight mode – same swipe-down panel as Wi-Fi.)", "photo": ""}, {"text": "[Trap] Take the lid off the trap. Push the button **once** – a flashing green light comes on.", "photo": "nzat-02.jpg"}, {"text": "[Phone settings] **Turn phone Wi-Fi ON** and select the trap's Wi-Fi. Its name starts **ESP_** followed by letters/numbers that match the label on the trap's circuit board (or shows the trap number if it has been renamed). iPhone: Settings › Wi-Fi – when the trap shows, press the blue **\"i\"** at the **right-hand end** of that line to activate the trap connection.", "photo": "nzat-03.jpg"}, {"text": "[Phone settings] Connect the phone to the trap Wi-Fi. The phone may warn **\"no internet connection\"** – that is expected, stay connected.", "photo": "nzat-04.jpg"}, {"text": "[NZAT app] Go back to the NZAT app. On the **Comms** tab (bottom left) tap the green **CONNECT** button – it is just under the green banner near the top of the screen. The banner then reads **\"Trap network: Connected\"** with the trap name. iPhone: if it fails, tap CONNECT once or twice more.", "photo": "nzatapp-connect.jpg"}, {"text": "[NZAT app] Tap the **Triggers** tab (bottom of screen, third from the left). Three boxes run across the top: **All cycles**, **Triggers** and **Possums**. Use **Triggers** – not All cycles. **Triggers minus Possums = rats.**", "photo": "nzatapp-triggers.jpg"}, {"text": "[NZAT app] Note the trap number, Triggers, Possums and the **run time** as shown (days only).", "photo": ""}, {"text": "[Guidance app] Enter Triggers, Possums and run time on screen 3 of the service form (**Service**, bottom of screen).", "photo": ""}, {"text": "[NZAT app] **Re-set the counts:** still on the **Triggers** tab, tap the green **RESET COUNTS** button – right-hand side, just under the three count boxes, next to \"Last Reset\". Tap **Confirm** if asked. The counts go to 0 and the Last Reset date updates.", "photo": "nzat-06.jpg"}, {"text": "[Trap] Unscrew the battery.", "photo": ""}, {"text": "[Trap] Re-fill the lure pouch from the squeeze bottle. Check the tube is not twisted.", "photo": ""}, {"text": "[Trap] Fit a new (charged) battery.", "photo": ""}, {"text": "[Trap] Press the button **3 times** – the light goes **constant orange** (pump mode). Then **press and hold** (or press a 4th time) to pump lure. Wait 1–3 seconds, then press **4 times without pausing** to set the trap – the light goes **green**.", "photo": ""}, {"text": "[Trap] Leave the trap with the **green light** showing. Fit the lid and fasten it with the black tabs.", "photo": ""}, {"text": "[NZAT app] Tap **Comms** (bottom left), then the red **DISCONNECT** button (right of CONNECT). The visit record is kept in the NZAT app and syncs to Trap.NZ next time you have signal.", "photo": ""}, {"text": "[Guidance app] Tap **Next ›** (bottom right) through the remaining screens and **Save service** on the last one.", "photo": ""}], "tip": ["If an **orange** or **red** warning shows, the lights are obscured – follow the **Cleaning the sensor lights** guide before you set the trap."], "warn": ["**NEVER put hands inside a set trap.**", "In the NZAT app, **do not press ARM or FIRE** (lower down the Triggers tab) – holding FIRE for 5 seconds fires the trap."]}, {"id": "nzatscreens", "t": "NZAT app – where to find things", "hl": "none", "steps": [{"text": "[NZAT app] **Tabs** run along the **bottom of the screen**, left to right: **Comms**, **Trap**, **Triggers**, **Pump**. The menu (three lines) is at the **top right**.", "photo": ""}, {"text": "[NZAT app] **Comms tab** (bottom left) – the green banner at the top shows **\"Trap network: Connected\"**, the trap name, time connected, the trap status (**SET** when set) and the trap Wi-Fi name (ESP_…). Under it is a row of indicators – **Pump, Motor, Bar, Cam** (green = on, orange = warning). Below that are the green **CONNECT** (left) and red **DISCONNECT** (right) buttons. Further down: trap name, trap position and **Status** (Trap ready, Pump ready).", "photo": "nzatapp-comms.jpg"}, {"text": "[NZAT app] **Trap tab** (second from left) – **Bar state** at the top, then **Eye 1** and **Eye 2** side by side, each with a value and **Light Level**. A **green tick** means that eye is clear. **Red** means it is obscured – clean the lights. (The Accelerometer / DETECT button at the bottom is a possum-sensor test – not needed for servicing.)", "photo": "nzatapp-trap.jpg"}, {"text": "[NZAT app] **Triggers tab** (third from left) – three boxes across the top: **All cycles**, **Triggers**, **Possums**. Under them, **Last Reset** (date of the last reset) with the green **RESET COUNTS** button on the right. Lower down: Day/Night, Timer, Daytime ops (leave Disabled), Manual Control, and **ARM** / **FIRE** (do not use).", "photo": "nzatapp-triggers.jpg"}, {"text": "[NZAT app] **Pump tab** (bottom right) – days between baiting, pump run time, pump cycles and a manual pump button. No changes needed on a normal service.", "photo": ""}], "tip": ["**If it won't connect:** \"Wrong type – Cellular\" = turn mobile data off; \"Wrong type – Bluetooth\" = turn Bluetooth off; \"Wrong type – VPN\" = turn the VPN off. \"No traps found\" = the trap's Wi-Fi switched itself off (it only stays on a few minutes) – press the trap button once more (don't press repeatedly – it can fire the trap) and reconnect to the ESP_ Wi-Fi. \"Connection fails\" = iPhone: tap CONNECT again once or twice; Android: unscrew the battery, refit it and start again.", "Based on NZ Autotraps' **NZAT App Support guide v1.0** (app version 0.5.2) – nzautotraps.com › Downloads. Newer app versions may look slightly different."], "warn": ["**Do not press ARM or FIRE** on the Triggers tab, and leave **Daytime ops** off and the **Pump** settings as they are unless the team has agreed a change."]}, {"id": "battery", "t": "Replacing / charging the battery", "hl": "battery", "steps": [{"text": "[NZAT app] Read the counts and tap **RESET COUNTS** on the Triggers tab first (see the Using the NZAT app guide).", "photo": ""}, {"text": "[Trap] Unscrew the battery.", "photo": "battery-connected.jpg"}, {"text": "[Trap] Re-fill the lure pouch while the battery is out (see Topping up the lure).", "photo": ""}, {"text": "[Trap] Fit a fully charged battery and screw it in firmly.", "photo": "battery-plug.jpg"}, {"text": "[Trap] Press the button **3 times** – the light goes **constant orange** (pump mode). Then **press and hold** (or press a 4th time) to pump lure. Wait 1–3 seconds, then press **4 times without pausing** to set the trap – the light goes **green**.", "photo": ""}, {"text": "[Guidance app] On screen 4 of the service form (Battery) tap **Replaced with charged pack**.", "photo": ""}, {"text": "Take the old battery home and charge it overnight with a USB charger.", "photo": "battery-charger.jpg"}], "tip": ["A charge typically lasts about 4–6 months, less with high activity, sensor faults or frequent app use. Carry spare charged batteries on each round. No light at all usually means a flat or badly connected battery."], "warn": []}, {"id": "lure", "t": "Topping up the lure", "hl": "lure", "steps": [{"text": "[Trap] Do this while the battery is unscrewed.", "photo": ""}, {"text": "[Trap] Re-fill the lure pouch from the squeeze bottle.", "photo": "lure-pouch.jpg"}, {"text": "[Trap] Check the tube is not twisted, kinked or blocked. Fit the lure cap securely.", "photo": ""}, {"text": "[Trap] After fitting the new battery: press the button **3 times** – the light goes **constant orange** (pump mode). Then **press and hold** (or press a 4th time) to pump lure. Wait 1–3 seconds, then press **4 times without pausing** to set the trap – the light goes **green**.", "photo": ""}, {"text": "[Trap] Wipe up spilt lure – it attracts insects and birds.", "photo": ""}, {"text": "[Guidance app] On screen 5 of the service form (Lure) tap **Topped up**, **New pouch** or **New tube / cap fitted** so it shows in the report.", "photo": ""}], "tip": [], "warn": []}, {"id": "eyes", "t": "Cleaning the sensor lights (orange / red warning)", "hl": "eyes", "steps": [{"text": "If the lights are obscured, the trap light blinks **orange** (or **red**).", "photo": ""}, {"text": "[Trap] **Trigger the trap:** press the button **once** to wake it (green), wait 1–3 seconds, then press **once more** – the light goes **constant red** and the trap fires.", "photo": ""}, {"text": "[Trap] **Then remove the battery** (unscrew it) with the kill bar closed, so the trap can't re-set.", "photo": ""}, {"text": "[Trap] Spray both lights with water from the spray bottle.", "photo": ""}, {"text": "[Trap] Brush rubbish off the lights with a paint brush and toothbrush.", "photo": ""}, {"text": "[Trap] Spray again to clean.", "photo": ""}, {"text": "[Trap] Replace the battery and press the button **4 times without pausing** to reset the trap.", "photo": ""}, {"text": "[Trap] If the trap light is **green**, everything is OK. Replace the lid and fasten it with the black tabs.", "photo": ""}, {"text": "[NZAT app] If the light is **red**, reconnect to the trap in the NZAT app (see **Using the NZAT app**, steps 4–6), tap the **Trap** tab (bottom of screen, second from left) and check **Eye 1** and **Eye 2**: a green tick = clear, red = still obscured.", "photo": "nzatapp-trap.jpg"}, {"text": "[Trap] If the lights still show as obscured, **clean them again** – repeat steps 2–8 (trigger, remove battery, spray, brush, spray, replace battery) until the light is **green**.", "photo": ""}, {"text": "[Guidance app] On screen 6 of the service form (Sensor lights) tap **Cleaned**, **Eye 1 cleaned** or **Eye 2 cleaned**.", "photo": ""}], "tip": ["Don't scrub hard or use solvents – scratched lenses cause false readings."], "warn": ["**Trigger the trap first** (wake it, then press once more – constant red), **then remove the battery** – before you touch the lights. Never clean the lights on a set trap."]}, {"id": "debris", "t": "Clearing debris, mesh & tags", "hl": "ladder", "steps": [{"text": "[Trap] Make the trap safe first: **trigger the trap** (press once to wake, wait 1–3 seconds, press once more – constant red), **then remove the battery**.", "photo": ""}, {"text": "[Trap] Clear debris only if it affects the lights or the trap movement. Avoid unnecessary handling.", "photo": ""}, {"text": "[Trap] Check the rat ladder (hanging webbing / mesh) is intact and reaches the ground. Free any caught animals.", "photo": ""}, {"text": "[Trap] Check the trap number tag and mounting brackets are secure.", "photo": ""}, {"text": "[Trap] Clear vegetation around the trap so animals can reach it.", "photo": ""}, {"text": "[Guidance app] Record what you found on screen 7 of the service form (General check) – e.g. **Debris cleared** or **Tag(s) broken**.", "photo": ""}], "tip": [], "warn": []}, {"id": "led", "t": "Button presses & lights", "hl": "led", "steps": [{"text": "[Trap] **1 press** – wakes the trap (also restarts the Wi-Fi link for the NZAT app).", "photo": "button-led.jpg"}, {"text": "[Trap] **Fire the trap** – after waking, wait 1–3 seconds and press **once more**. Light goes **constant red** (manual) and the trap fires if set.", "photo": ""}, {"text": "[Trap] **Pump lure** – **3 presses**: light goes **constant orange**. Then **press and hold** (or a 4th press) to run the pump.", "photo": ""}, {"text": "[Trap] **Set the trap / end manual** – **4 presses without pausing**: light goes **green**.", "photo": ""}, {"text": "[Trap] Wait **1–3 seconds** between each of these steps.", "photo": ""}, {"text": "[Trap] **Green blinking** – all good. Always leave the trap like this.", "photo": ""}, {"text": "[Trap] **Orange blinking** – an eye is not completely clear. Clean the lights.", "photo": ""}, {"text": "[Trap] **Orange constant** – manual pump mode.", "photo": ""}, {"text": "[Trap] **Red blinking** – fault, often a blocked eye. Clean the lights; if still red, check **Eye 1** / **Eye 2** on the NZAT app **Trap** tab.", "photo": ""}, {"text": "[Trap] **Red constant** – manual mode (trap fired). Press **4 times** to return to automatic.", "photo": ""}, {"text": "[Trap] **No light** – asleep or flat battery. Press once; still no light = flat battery.", "photo": ""}, {"text": "[Guidance app] Record the light you saw on arrival on screen 2 of the service form (LED status on arrival).", "photo": ""}], "tip": [], "warn": []}, {"id": "reset", "t": "Setting the trap & finishing", "hl": "led", "steps": [{"text": "[NZAT app] Make sure the counts have been re-set (Triggers tab – the Last Reset date should be today).", "photo": ""}, {"text": "[Trap] Fit the new battery with hands well clear of the opening.", "photo": ""}, {"text": "[Trap] Press the button **3 times** – the light goes **constant orange** (pump mode). Then **press and hold** (or press a 4th time) to pump lure. Wait 1–3 seconds, then press **4 times without pausing** to set the trap – the light goes **green**.", "photo": ""}, {"text": "[Trap] Leave the trap with the **green light** showing. Fit the lid and fasten it with the black tabs.", "photo": ""}, {"text": "[Guidance app] On the last service screen tap **+ Add photo** to take a photo of the trap, tick **Counts re-set in NZAT app**, then tap **Save service** (bottom right).", "photo": ""}, {"text": "Check nothing is left behind (tools, old pouches, rubbish).", "photo": ""}], "tip": [], "warn": []}];
const normG=g=>({...g,steps:g.steps.map(x=>typeof x==='string'?{text:x,photo:''}:x),tip:[].concat(g.tip||[]),warn:[].concat(g.warn||[])});

re. Wait 1–3 seconds, then press **4 times without pausing** to set. Leave with the **green light** showing, fit the lid and fasten the black tabs. [Guidance app] Fill in below, then tap **Save service** (bottom right)."};

const GUIDES_DEFAULT=JSON.parse(JSON.stringify(GUIDES));

let TEXT_SRC='built-in';
function applyAppText(rowsG,rowsS){
  if(rowsG&&rowsG.length){const out=[],by={};
    for(const r of rowsG){const id=String(r.id||'').trim();if(!id)continue;
      let g=by[id];if(!g){g=by[id]={id,t:String(r.title||id).trim(),hl:String(r.diagram||'none').trim().toLowerCase(),steps:[],tip:[],warn:[]};out.push(g);}
      if(r.title&&!g.t)g.t=r.title;
      const type=String(r.type||'step').trim().toLowerCase(),text=String(r.text||'').trim();if(!text&&!r.photo)continue;
      if(type.startsWith('tip'))g.tip.push(text);else if(type.startsWith('warn'))g.warn.push(text);else g.steps.push({text,photo:String(r.photo||'').trim()});}
    if(out.length)GUIDES=out;}
  if(rowsS&&rowsS.length){const acc={};for(const r of rowsS){const k=String(r.key||'').trim();if(!k)continue;const t=String(r.text??'').trim();(acc[k]=acc[k]||[]).push(t);}
    for(const[k,v]of Object.entries(acc))SVC[k]=Array.isArray(SVC_DEFAULT[k])?v.filter(Boolean):v[0];}
}
function parseAppText(buf){const wb=XLSX.read(buf,{type:'array'});
  const sheet=n=>{const name=wb.SheetNames.find(x=>x.toLowerCase().startsWith(n));if(!name)return null;const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:''});
    const hi=rows.findIndex(r=>r.some(c=>/guide id|^key$/i.test(String(c).trim())));if(hi<0)return null;const h=rows[hi].map(c=>String(c).trim().toLowerCase());
    const map={id:h.findIndex(c=>c==='guide id'),title:h.findIndex(c=>c.startsWith('guide title')),diagram:h.findIndex(c=>c.startsWith('diagram')),type:h.findIndex(c=>c.startsWith('row type')),text:h.findIndex(c=>c==='text'),photo:h.findIndex(c=>c.startsWith('photo')),key:h.findIndex(c=>c==='key')};
    return rows.slice(hi+1).map(r=>{const o={};for(const[k,i]of Object.entries(map))if(i>=0)o[k]=r[i];return o;});};
  return{g:sheet('guide'),s:sheet('service')};}
async function loadAppText(){
  if(!window.XLSX)return;
  try{const r=await fetch('app-text.xlsx',{cache:'no-cache'});if(!r.ok)throw 0;const buf=await r.arrayBuffer();const t=parseAppText(buf);applyAppText(t.g,t.s);TEXT_SRC='app-text.xlsx';
    GUIDES.forEach(g=>g.steps.forEach(st=>st.photo&&fetch('images/'+encodeURIComponent(st.photo)).catch(()=>{})));return;}catch(e){}
  const st=await DB.get('kv','appText');if(st){applyAppText(st.g,st.s);TEXT_SRC='imported file ('+st.name+')';}
}
async function importAppText(file){try{const t=parseAppText(await file.arrayBuffer());if(!t.g&&!t.s)throw 0;await DB.put('kv','appText',{...t,name:file.name});
  GUIDES=JSON.parse(JSON.stringify(GUIDES_DEFAULT));SVC=JSON.parse(JSON.stringify(SVC_DEFAULT));applyAppText(t.g,t.s);TEXT_SRC='imported file ('+file.name+')';toast('App text loaded');vSettings();}catch(e){toast('Could not read that file as app text');}}

/* ---------- Map ---------- */
function mapSVG(opts={}){
  const pts=S.traps.filter(t=>t.lat!=null);if(!pts.length)return '<p class="mute">No trap locations.</p>';
  const all=pts.concat(opts.me&&G.pos&&dist(G.pos,pts[0])<20000?[G.pos]:[]);
  let minLa=Math.min(...all.map(p=>p.lat)),maxLa=Math.max(...all.map(p=>p.lat)),minLo=Math.min(...all.map(p=>p.lng)),maxLo=Math.max(...all.map(p=>p.lng));
  const k=Math.cos(rad((minLa+maxLa)/2));const W=340,pad=24;
  const spanX=Math.max((maxLo-minLo)*k,1e-4),spanY=Math.max(maxLa-minLa,1e-4);
  const sc=(W-2*pad)/Math.max(spanX,spanY*0.8);const Hh=Math.round(spanY*sc+2*pad);
  const X=p=>pad+(p.lng-minLo)*k*sc,Y=p=>pad+(maxLa-p.lat)*sc;
  const m100=100/111320*sc; // 100 m in px
  let s=`<svg id="mapsvg" viewBox="0 0 ${W} ${Hh}" font-family="system-ui">`;
  s+=`<g stroke="var(--ink)" stroke-width="1.5"><path d="M${W-pad-m100*2} ${Hh-10} h${m100*2}"/></g><text x="${W-pad-m100}" y="${Hh-14}" font-size="10" text-anchor="middle" fill="var(--mute)">200 m</text>`;
  s+=`<text x="${W-14}" y="20" font-size="12" text-anchor="middle" fill="var(--mute)">N</text><path d="M${W-14} 24 v14 M${W-18} 29 l4-5 4 5" stroke="var(--mute)" fill="none"/>`;
  sortTraps(pts).forEach(t=>{const v=visitFor(t.id,opts.round);const col=opts.value?opts.value(t):(v?'var(--ok)':'#d08a1c');
    const r=opts.radius?opts.radius(t):10;
    s+=`<g data-id="${esc(t.id)}" style="cursor:pointer"><circle cx="${X(t).toFixed(1)}" cy="${Y(t).toFixed(1)}" r="${r}" fill="${col}" stroke="#fff" stroke-width="1.5" opacity=".92"/><text x="${X(t).toFixed(1)}" y="${(Y(t)+3.5).toFixed(1)}" font-size="9.5" font-weight="700" text-anchor="middle" fill="#fff">${esc(t.id)}</text></g>`;});
  if(opts.me&&G.pos&&dist(G.pos,pts[0])<20000)s+=`<circle cx="${X(G.pos)}" cy="${Y(G.pos)}" r="${Math.max(6,G.pos.acc/111320*sc)}" fill="rgba(40,120,255,.18)"/><circle cx="${X(G.pos)}" cy="${Y(G.pos)}" r="6" fill="#2878ff" stroke="#fff" stroke-width="2"/>`;
  return s+'</svg>';
}
function vMap(){
  startGPS();
  $('#view').innerHTML=`<div class="card"><h2>Trap map</h2><div class="mute sm" style="margin-bottom:8px">Works offline (no background imagery). <span class="pill ok">serviced</span> <span class="pill warn">to do</span> <span class="pill" style="background:#2878ff;color:#fff">you</span> · tap a trap to locate it.</div><div id="mapbox">${mapSVG({me:true})}</div></div>`;
  const bind=()=>document.querySelectorAll('#mapsvg g[data-id]').forEach(g=>g.onclick=()=>go('trap',g.dataset.id));bind();

   ${st>0?'<button class="btn sm full" style="margin-top:10px" id="cancelV">Cancel</button>':''}</div>`;
  const collect=()=>{['triggers','rats','possums','cycles','batteryPct','days'].forEach(k=>{const e=$('#f_'+k);if(e)v[k]=e.value===''?'':Math.max(0,+e.value);});

    if(v.dataSource!=='manual'&&v.triggers!==''&&v.triggers!=null)v.rats=Math.max(0,(+v.triggers||0)-(+v.possums||0));};
  document.querySelectorAll('.seg[data-k] button').forEach(b=>b.onclick=()=>{collect();const k=b.parentElement.dataset.k;v[k]=v[k]===b.dataset.val?'':b.dataset.val;vService();});
  document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{collect();v[b.dataset.inc]=(+v[b.dataset.inc]||0)+1;vService();});
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{collect();v[b.dataset.dec]=Math.max(0,(+v[b.dataset.dec]||0)-1);vService();});

  if(st===7){

    $('#addPh').onclick=()=>pickPhoto(async d=>{const pid='p'+uid();await DB.put('photos',pid,d);v.photos.push(pid);draw();});
    $('#saveV').onclick=()=>{collect();if(!String(v.observer||'').trim()){toast('Type your name in "Serviced by" first');const o=$('#f_observer');if(o){o.focus();o.style.borderColor='var(--bad)';}return;}v.observer=String(v.observer).trim();v.updated=Date.now();if(G.pos)v.gps={lat:+G.pos.lat.toFixed(6),lng:+G.pos.lng.toFixed(6),acc:Math.round(G.pos.acc)};
      if(v.observer)S.settings.observer=v.observer;
      S.visits=S.visits.filter(x=>x.id!==v.id);S.visits.push(v);save();toast(`Trap ${v.trap} saved`);
      const left=sortTraps(S.traps).filter(t=>!visitFor(t.id));W=null;
      if(left.length&&G.pos){const n=left.filter(t=>t.lat!=null).sort((a,b)=>dist(G.pos,a)-dist(G.pos,b))[0];if(n&&confirm(`Saved. Navigate to nearest unserviced trap (${n.id}, ${fmtDist(dist(G.pos,n))})?`))return go('trap',n.id);}
      go('traps');};
  }

function pickPhoto(cb){const f=$('#fileIn');f.accept='image/*';f.setAttribute('capture','environment');f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return;const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',0.75));};img.src=url;};f.click();}

const LAB={battery:{ok:'',replaced:'battery replaced',low:'battery low'},lure:{ok:'',topped:'lure topped up',new:'new lure pouch',tube:'new tube/cap fitted',low:'needs new tube'},eyes:{clean:'',cleaned:'eyes cleaned',eye1:'eye 1 cleaned',eye2:'eye 2 cleaned',fault:'sensor fault'},ladder:{ok:'',cleared:'debris cleared',tags:'tag(s) broken',repair:'needs repair'},led:{green:'',orange:'LED orange',red:'LED red – fault',none:'no LED (flat battery?)'}};
function autoComment(v){const parts=['led','battery','lure','eyes','ladder'].map(k=>LAB[k][v[k]]).filter(Boolean);if(v.dataSource==='manual')parts.push('manual count');if(v.comments)parts.push(v.comments);return parts.join('. ');}
function reportData(r){
  const vs=roundVisits(r);const rows=sortTraps(S.traps).map(t=>({t,v:vs.find(x=>x.trap===t.id)}));
  const done=rows.filter(x=>x.v);const sum=k=>done.reduce((a,x)=>a+(+x.v[k]||0),0);
  const days=sum('days'),rats=sum('rats'),pos=sum('possums');
  const idx=r?rounds().indexOf(r):0;const all=rounds();
  const prevR=[...new Set(S.visits.map(v=>v.round))].filter(x=>x!==r).map(x=>({x,d:S.visits.filter(v=>v.round===x).map(v=>v.date).sort().pop()})).filter(o=>o.d<(done.map(x=>x.v.date).sort()[0]||'9')).sort((a,b)=>b.d.localeCompare(a.d))[0];
  let prev=null;if(prevR){const pv=S.visits.filter(v=>v.round===prevR.x);prev={round:prevR.x,n:pv.length,days:pv.reduce((a,v)=>a+(+v.days||0),0),rats:pv.reduce((a,v)=>a+(+v.rats||0),0),possums:pv.reduce((a,v)=>a+(+v.possums||0),0)};}
  const dates=done.map(x=>x.v.date).sort();
  return{r,rows,done,days,rats,pos,prev,dates,missing:rows.filter(x=>!x.v).map(x=>x.t.id)};
}
function vReport(){
  const rs=rounds();const withData=rs.filter(r=>roundVisits(r).length);const sel=ARG||(roundVisits().length?curRound():(withData[withData.length-1]||curRound()));const D=reportData(sel);
  const rate=(n,d)=>d?(n/d*100).toFixed(1):'–';
  const top=D.done.slice().sort((a,b)=>(b.v.rats+b.v.possums)-(a.v.rats+a.v.possums)).slice(0,5);
  const maint=D.done.filter(x=>autoComment(x.v));
  const maxC=Math.max(1,...D.done.map(x=>+x.v.rats||0));
  const repMap=mapSVG({round:sel,value:t=>{const v=D.done.find(x=>x.t.id===t.id)?.v;if(!v)return '#9aa39d';const f=(+v.rats||0)/maxC;return `rgb(${Math.round(240-f*150)},${Math.round(170-f*120)},${Math.round(60-f*30)})`;},radius:t=>{const v=D.done.find(x=>x.t.id===t.id)?.v;return v?8+Math.sqrt(+v.rats||0)*1.8:7;}});
  $('#view').innerHTML=`
  <div class="card noprint"><h2>Report</h2><label>Service round</label><select id="rsel">${rs.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}</select>

  <div id="reportOut" class="card">
   <div style="border-bottom:3px solid var(--brand);padding-bottom:8px;margin-bottom:10px"><div class="mute sm">${esc(S.settings.site)} – NZ Autotraps AT220</div><h2 style="font-size:20px;margin:2px 0">${esc(sel)} service results</h2>
   <div class="mute sm">${D.dates.length?`Serviced ${fmtD(D.dates[0])}${D.dates.length>1?' – '+fmtD(D.dates[D.dates.length-1]):''}`:'No services recorded'} · ${D.done.length} of ${D.rows.length} traps${(()=>{const o=[...new Set(D.done.map(x=>x.v.observer).filter(Boolean))];return o.length?' · '+esc(o.join(', ')):'';})()}</div></div>
   <h3>Summary</h3>
   <div class="kpis"><div class="kpi"><b>${D.rats}</b><span>rats (trap triggers)</span></div><div class="kpi"><b>${D.pos}</b><span>possums</span></div>
   <div class="kpi"><b>${D.days.toLocaleString()}</b><span>trap-days since last service</span></div><div class="kpi"><b>${rate(D.rats,D.days)}</b><span>rats per 100 trap-days</span></div></div>
   ${D.prev?`<p class="sm">Previous round (${esc(D.prev.round)}): ${D.prev.rats} rats, ${D.prev.possums} possums over ${D.prev.days.toLocaleString()} trap-days (${rate(D.prev.rats,D.prev.days)} rats / 100 trap-days) from ${D.prev.n} traps.</p>`:''}
   ${top.length?`<p class="sm"><b>Highest catches:</b> ${top.map(x=>`trap ${esc(x.t.id)} (${x.v.rats} rats${x.v.possums?`, ${x.v.possums} possum${x.v.possums>1?'s':''}`:''})`).join('; ')}.</p>`:''}
   ${D.missing.length&&D.done.length?`<p class="sm"><b>Not serviced this round:</b> ${D.missing.join(', ')}.</p>`:''}
   <h3>Results by trap</h3>
   <div class="tbl"><table><tr><th>trap #</th><th>Lat</th><th>Long</th><th>checked</th><th class="c">No.days</th><th class="c">fired rats</th><th class="c">possum</th><th>re-set</th><th>comments</th></tr>
   ${D.rows.map(({t,v})=>`<tr><td class="c">${esc(t.id)}</td><td>${t.lat!=null?t.lat.toFixed(6):''}</td><td>${t.lng!=null?t.lng.toFixed(6):''}</td><td>${v?fmtD(v.date):''}</td><td class="c">${v?v.days:''}</td><td class="c">${v?v.rats:''}</td><td class="c">${v?v.possums:''}</td><td>${v?fmtD(v.reset):''}</td><td style="white-space:normal;min-width:140px">${v?esc(autoComment(v)):''}</td></tr>`).join('')}

   <p class="mute sm" style="margin-top:14px">Counts are trap trigger counts read from the AT220 (NZAT app) unless noted as manual. No.days = days since the previous service/re-set.</p>
  </div>
  <div class="card noprint"><h2>Data</h2><div class="btns">
   <button class="btn pri sm" onclick="pickFiles('.json,application/json',mergeFiles)">Merge round files…</button><button class="btn sm" onclick="sendRound('${esc(sel)}')">Send my round</button><button class="btn sm" onclick="go('settings')">Settings & import</button><button class="btn sm" id="bk">Backup (JSON)</button></div>
   <div class="mute sm" style="margin-top:6px">Combine everyone's data here before publishing – see the guide <a href="#" onclick="go('guide','share');return false">Sending data &amp; making the report</a>.</div></div>`;
  $('#rsel').onchange=e=>go('report',e.target.value);
  $('#csv').onclick=()=>dl(`${S.settings.site} ${sel} AT220 results.csv`,toAOA(D).map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
  $('#xl').onclick=()=>{if(!window.XLSX)return toast('Excel library not loaded');const aoa=toAOA(D).map((r,i)=>i>2?r.map((c,j)=>(j===3||j===7)&&c?new Date(c+'T00:00'):c):r);const ws=XLSX.utils.aoa_to_sheet(aoa,{cellDates:true,dateNF:'d/mm/yyyy'});ws['!cols']=[{wch:7},{wch:12},{wch:12},{wch:11},{wch:8},{wch:10},{wch:8},{wch:11},{wch:40}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');XLSX.writeFile(wb,`${sel} AT 220 TRAP SERVICE RESULTS.xlsx`);};
  $('#bk').onclick=backup;
}
function toAOA(D){const out=[[`${D.r} service results:`],[`${(S.settings.site||'').toUpperCase()} AT220 traps`],['trap #','Lat','Long','checked','No.days','fired rats','possum','re-set','comments']];
  D.rows.forEach(({t,v})=>out.push([isNaN(+t.id)?t.id:+t.id,t.lat,t.lng,v?v.date:'',v?v.days:'',v?v.rats:'',v?v.possums:'',v?v.reset:'',v?autoComment(v):'']));
  out.push([]);out.push(['','','','',D.days,D.rats,D.pos]);out.push(['','','','','days','rats','possums']);return out;}
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

}
function pickFile(accept,cb){const f=$('#fileIn');f.accept=accept;f.removeAttribute('capture');f.value='';f.onchange=()=>f.files[0]&&cb(f.files[0]);f.click();}
function parseCoord(v){if(v==null||v==='')return null;const n=parseFloat(String(v).replace(/[°\s]/g,''));return isNaN(n)?null:n;}
async function importTraps(file){
  if(!window.XLSX)return toast('Spreadsheet library not loaded');
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  const hi=rows.findIndex(r=>r.some(c=>/trap/i.test(c))&&r.some(c=>/^lat/i.test(String(c).trim())));
  if(hi<0)return $('#impOut').innerHTML='<p class="pill bad">Could not find a header row with "trap" and "Lat" columns.</p>';
  const h=rows[hi].map(c=>String(c).trim().toLowerCase());
  const ci=re=>h.findIndex(c=>re.test(c));const cT=ci(/trap/),cLa=ci(/^lat/),cLo=ci(/^lon|^lng/);
  const noteCols=h.map((c,i)=>/location|note|comment|access|direction|descr|find|where/.test(c)&&i!==cT?i:-1).filter(i=>i>=0);
  let added=0,updated=0,warn=[];
  for(const r of rows.slice(hi+1)){const id=String(r[cT]).trim();if(!id||!/\d/.test(id))continue;
    let la=parseCoord(r[cLa]),lo=parseCoord(r[cLo]);if(la!=null&&la>0){la=-la;warn.push(`trap ${id}: latitude was positive – made negative`);}
    let t=trapById(id);
    if(la!=null&&lo!=null&&S.traps.length){const c=S.traps.filter(x=>x.lat!=null);const cx={lat:c.reduce((a,x)=>a+x.lat,0)/c.length,lng:c.reduce((a,x)=>a+x.lng,0)/c.length};const d=dist(cx,{lat:la,lng:lo});if(d>2500){warn.push(`trap ${id}: ${fmtDist(d)} from the other traps – coordinates NOT imported, check spreadsheet`);la=lo=null;}}
    const notes=noteCols.map(i=>String(r[i]).trim()).filter(Boolean).join(' · ');
    if(!t){t={id,lat:la,lng:lo,notes,src:'import'};S.traps.push(t);added++;}
    else{if(la!=null&&lo!=null){t.lat=+la.toFixed(6);t.lng=+lo.toFixed(6);t.src='import';}if(notes)t.notes=notes;updated++;}}
  save();$('#impOut').innerHTML=`<p><span class="pill ok">Imported</span> ${updated} traps updated, ${added} added${noteCols.length?` · notes from: ${noteCols.map(i=>esc(rows[hi][i])).join(', ')}`:' · no notes column found'}.</p>${warn.length?`<ul>${warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}`;
}
async function restore(file){try{const d=JSON.parse(await file.text());if(d.app!=='at220')throw 0;if(!confirm('Replace all data on this phone with the backup?'))return;
  S.traps=d.traps;S.visits=d.visits;S.settings=d.settings;S.guidePhotos=d.guidePhotos||{};for(const[k,v]of Object.entries(d.photos||{}))await DB.put('photos',k,v);save();toast('Backup restored');go('traps');}catch(e){toast('Not a valid AT220 backup file');}}

function markSent(r){S.settings.sent={...(S.settings.sent||{}),[r]:Date.now()};save();}
function endRoundCard(){
  const r=curRound(),vs=roundVisits(r),sent=(S.settings.sent||{})[r];
  const changed=sent?vs.filter(v=>(v.updated||0)>sent).length:0;
  const st=!sent?`<span class="pill warn">Not sent yet</span>`:changed?`<span class="pill warn">${changed} service(s) changed since you sent – send again</span>`:`<span class="pill ok">Sent ${new Date(sent).toLocaleString('en-NZ',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</span>`;
  return `<div class="card"><h2>Finished for the day / end of round?</h2><div style="margin-bottom:6px">${st}</div>
   <ol class="steps sm"><li>Check your traps show <b>done</b> below and the counts look right (tap a trap to fix).</li><li>Back in coverage, tap <b>Send my round</b> and send the file to the coordinator.</li><li>Put used batteries on charge and tell the coordinator about anything needing repair.</li><li>Keep the data on this phone until the coordinator says the report is done.</li></ol>
   <div class="btns"><button class="btn pri sm" onclick="sendRound()">Send my round</button><button class="btn sm" onclick="go('guide','endround')">Full end-of-round checklist</button></div></div>`;
}

/* ---------- Team data: send & merge ---------- */
function pickFiles(accept,cb){const f=$('#fileIn');f.accept=accept;f.removeAttribute('capture');f.multiple=true;f.value='';f.onchange=()=>{const fs=[...f.files];f.multiple=false;if(fs.length)cb(fs);};f.click();}
async function sendRound(r){
  r=r||curRound();const vs=S.visits.filter(v=>v.round===r);
  if(!vs.length)return toast('No services saved for '+r+' on this phone');
  const who=String(S.settings.observer||vs.find(v=>v.observer)?.observer||'unknown').trim();
  const n=vs.reduce((a,v)=>a+(v.photos||[]).length,0);const photos={};
  if(n&&confirm(`Include ${n} photo(s)?\n\nOK = include photos (bigger file – may be too big for WhatsApp)\nCancel = data only`)){for(const v of vs)for(const p of v.photos||[]){const d=await DB.get('photos',p);if(d)photos[p]=d;}}
  const data=JSON.stringify({app:'at220',kind:'round',v:1,round:r,from:who,sent:new Date().toISOString(),visits:vs,photos});
  const name=`AT220 ${r} - ${who} - ${today()}.json`.replace(/[\\/:*?"<>|]/g,'-');
  try{const file=new File([data],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){await navigator.share({files:[file],title:name,text:`AT220 ${r} service data from ${who} – ${vs.length} trap(s)`});markSent(r);toast('Round file sent');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  dl(name,data,'application/json');markSent(r);toast('Round file saved to Downloads');
}
const MKEYS=['trap','round','date','reset','days','triggers','rats','possums','cycles','dataSource','battery','batteryPct','lure','eyes','led','ladder','countsReset','comments','observer'];
const sameVisit=(a,b)=>MKEYS.every(k=>String(a[k]??'')===String(b[k]??''))&&String((a.photos||[]).join())===String((b.photos||[]).join());
async function mergeFiles(files){
  S.clashes=S.clashes||[];const res={files:0,added:0,same:0,updated:0,clash:0,bad:[],rounds:{},from:[]};
  for(const f of files){let d;try{d=JSON.parse(await f.text());}catch(e){res.bad.push(f.name);continue;}
    if(!d||d.app!=='at220'||!Array.isArray(d.visits)){res.bad.push(f.name);continue;}
    res.files++;if(d.from)res.from.push(d.from);
    for(const[k,val]of Object.entries(d.photos||{}))if(!(await DB.get('photos',k)))await DB.put('photos',k,val);
    for(const nv of d.visits){if(!nv||!nv.id||nv.trap==null)continue;nv.trap=String(nv.trap);
      const ex=S.visits.find(x=>x.id===nv.id);
      if(ex){if(sameVisit(ex,nv)||(ex.updated||0)>(nv.updated||0)){res.same++;continue;}
        if((nv.updated||0)>(ex.updated||0)){S.visits=S.visits.map(x=>x.id===nv.id?nv:x);res.updated++;continue;}
        if(!S.clashes.some(c=>c.b.id===nv.id&&sameVisit(c.b,nv))){S.clashes.push({a:ex.id,b:nv});res.clash++;}else res.same++;continue;}
      if(S.clashes.some(c=>c.b.id===nv.id)){res.same++;continue;}
      const other=S.visits.find(x=>x.round===nv.round&&x.trap===nv.trap);
      if(other){S.clashes.push({a:other.id,b:nv});res.clash++;continue;}
      S.visits.push(nv);res.added++;res.rounds[nv.round]=(res.rounds[nv.round]||0)+1;}}
  save();go('merge',res);
}
function clashTable(a,b){
  const L={battery:'Battery',lure:'Lure',eyes:'Sensor lights',led:'Light on arrival',ladder:'Ladder/tags'};
  const rows=[['Serviced by','observer'],['Checked','date'],['Run time (days)','days'],['Triggers','triggers'],['Rats','rats'],['Possums','possums'],['Counts from','dataSource'],...Object.entries(L).map(([k,l])=>[l,k]),['Comments','comments']];
  const cell=(v,k)=>k==='date'?fmtD(v[k]):esc(v[k]??'');
  return `<table class="sm" style="width:100%;border-collapse:collapse"><tr><th></th><th>A – on this phone</th><th>B – from file</th></tr>${rows.map(([l,k])=>{const d=String(a[k]??'')!==String(b[k]??'');return `<tr${d?' style="background:rgba(224,72,47,.10)"':''}><td class="mute">${l}</td><td>${cell(a,k)}</td><td>${cell(b,k)}</td></tr>`;}).join('')}<tr><td class="mute">Photos</td><td>${(a.photos||[]).length}</td><td>${(b.photos||[]).length}</td></tr></table>`;
}
function vMerge(){
  const res=ARG;S.clashes=(S.clashes||[]).filter(c=>{if(!S.visits.some(x=>x.id===c.a)){S.visits.push(c.b);return false;}return true;});save();
  const cl=S.clashes;
  $('#view').innerHTML=`${res?`<div class="card"><h2>Merge result</h2>
    <ul class="sm"><li><b>${res.files}</b> file(s) read${res.from.length?' – from '+esc([...new Set(res.from)].join(', ')):''}</li>
    <li><b>${res.added}</b> new trap service(s) added${Object.keys(res.rounds).length?' ('+Object.entries(res.rounds).map(([r,n])=>esc(r)+': '+n).join(', ')+')':''}</li>
    ${res.updated?`<li><b>${res.updated}</b> updated with a newer edit</li>`:''}
    <li><b>${res.same}</b> already on this phone – skipped</li>
    ${res.clash?`<li style="color:var(--bad)"><b>${res.clash}</b> clash(es) – see below</li>`:''}
    ${res.bad.length?`<li style="color:var(--bad)">Not an AT220 data file: ${esc(res.bad.join(', '))}</li>`:''}</ul>
    ${Object.keys(res.rounds).some(r=>r!==curRound())?`<div class="tip sm">Some records are for a different round name than this phone's current round (<b>${esc(curRound())}</b>). If that's a typo (e.g. "Nov 2026" vs "November 2026"), ask the sender to fix the round name, re-save and resend.</div>`:''}</div>`:''}
  <div class="card"><h2>Clashes to resolve (${cl.length})</h2>
   ${cl.length?`<div class="mute sm">The same trap was recorded twice in the same round. Differences are highlighted. Tap <b>Keep</b> on the correct record – the other is removed.</div>`+cl.map((c,i)=>{const a=S.visits.find(x=>x.id===c.a);return `<div style="border-top:1px solid var(--line);padding:10px 0;margin-top:8px"><b>Trap ${esc(c.b.trap)}</b> · ${esc(c.b.round)}${clashTable(a,c.b)}<div class="btns"><button class="btn sm" data-keep="${i}:a">Keep A (${esc(a.observer||'?')})</button><button class="btn sm" data-keep="${i}:b">Keep B (${esc(c.b.observer||'?')})</button></div></div>`;}).join(''):'<div class="mute sm">None – all data combined.</div>'}
  </div>
  <div class="btns"><button class="btn pri" onclick="go('report')">Go to report</button><button class="btn" onclick="pickFiles('.json,application/json',mergeFiles)">Merge more files…</button></div>`;
  document.querySelectorAll('[data-keep]').forEach(b=>b.onclick=()=>{const[i,w]=b.dataset.keep.split(':');const c=S.clashes[+i];
    if(w==='b'){S.visits=S.visits.filter(x=>x.id!==c.a);S.visits.push(c.b);}
    S.clashes.splice(+i,1);save();toast('Kept '+w.toUpperCase());ARG=null;vMerge();});
}
function roundCheck(D){
  const cl=(S.clashes||[]).filter(c=>c.b.round===D.r).length;const by={};D.done.forEach(x=>{const o=x.v.observer||'(no name)';by[o]=(by[o]||0)+1;});
  const ok=!D.missing.length&&!cl;
  return `<div class="card noprint"><h2>Round check ${ok?'<span class="pill ok">Ready to publish</span>':'<span class="pill warn">Not complete</span>'}</h2>
   <ul class="sm"><li><b>${D.done.length} of ${D.rows.length}</b> traps serviced</li>
   ${D.missing.length?`<li>Not yet in this phone: trap${D.missing.length>1?'s':''} <b>${D.missing.map(esc).join(', ')}</b> – merge the missing round files, or they weren't serviced</li>`:''}
   ${cl?`<li style="color:var(--bad)"><b>${cl}</b> clash(es) to resolve – <a href="#" onclick="go('merge');return false">resolve now</a></li>`:''}
   <li>Serviced by: ${Object.entries(by).map(([o,n])=>esc(o)+' ('+n+')').join(', ')||'–'}</li></ul></div>`;
}

/* ---------- Boot ---------- */
(async()=>{
  await DB.open();const st=await DB.get('kv','state');
  if(st&&st.traps){S={...S,...st};}
  else{S.traps=SEED.traps;S.visits=SEED.history.map(h=>({id:'oct26_'+h.trap,round:'October 2026',dataSource:'app',observer:'',photos:[],battery:'',lure:'',eyes:'',led:'',ladder:'',countsReset:true,...h}));S.settings.round='';save();}
  await loadAppText();
  go('traps');
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
